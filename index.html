<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Biology Game</title>
<style>
body{text-align:center;font-family:Arial;background:#eef6ff;padding:20px}
input,button{padding:10px;margin:5px}
button{background:#00509e;color:white;border:none}
canvas{border:2px solid #00509e;margin-top:20px}
</style>
</head>
<body>

<h1>Biology Vocabulary Game</h1>

<div id="login">
<input id="name" placeholder="Name"><br>
<input id="cls" placeholder="Class"><br>
<input id="no" placeholder="Class No"><br>
<button onclick="start()">Start</button>
</div>

<div id="game"></div>

<script>

let score=0;

const q=[
["胃","Stomach"],
["肝臟","Liver"],
["胰臟","Pancreas"]
];

function start(){

if(!name.value||!cls.value||!no.value){
alert("Fill in all fields");
return;
}

login.style.display="none";
show(0);
}

function show(i){

if(i>=q.length){

game.innerHTML=`
<h2>Completed!</h2>
<p>Score: ${score}</p>

<canvas id="cert" width="500" height="300"></canvas>

<br><br>

<button onclick="downloadCert()">
Download Certificate
</button>
`;

drawCert();

return;
}

game.innerHTML=
"<h2>"+q[i][0]+"</h2>"+
"<button onclick='ok("+i+")'>"+q[i][1]+"</button>";
}

function ok(i){
score+=100;
show(i+1);
}

function drawCert(){

let c=document.getElementById("cert");
let x=c.getContext("2d");

x.fillStyle="white";
x.fillRect(0,0,500,300);

x.fillStyle="#00509e";
x.font="24px Arial";
x.fillText("Certificate",170,50);

x.fillStyle="black";
x.font="18px Arial";

x.fillText("Name: "+name.value,50,120);
x.fillText("Class: "+cls.value,50,160);
x.fillText("Class No: "+no.value,50,200);
x.fillText("Score: "+score,50,240);
}

function downloadCert(){

let c=document.getElementById("cert");

let a=document.createElement("a");

a.download="Certificate.png";

a.href=c.toDataURL();

a.click();
}

</script>

</body>
</html>
